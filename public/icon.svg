<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0b1728" />
      <stop offset="100%" stop-color="#040810" />
    </radialGradient>
    <linearGradient id="facetTop" x1="256" y1="90" x2="256" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a3ff12" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="facetLeft" x1="120" y1="205" x2="256" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="facetRight" x1="392" y1="205" x2="256" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#a3ff12" flood-opacity="0.35" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- App Rounded Squircle Container -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="220" r="160" fill="#10b981" opacity="0.15" filter="url(#glow)" />

  <!-- Financial Diamond Crystal Emblem -->
  <g filter="url(#shadow)">
    <!-- Top Apex Facet -->
    <polygon points="256,90 392,205 256,265 120,205" fill="url(#facetTop)" filter="url(#glow)" />
    <!-- Left Facet -->
    <polygon points="120,205 256,265 256,430" fill="url(#facetLeft)" />
    <!-- Right Facet -->
    <polygon points="392,205 256,265 256,430" fill="url(#facetRight)" />
    
    <!-- Central Upward Growth Vector Symbol -->
    <polyline points="196,290 256,230 316,290" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="256" y1="230" x2="256" y2="355" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />

    <!-- Pure Sparkle Jewel at Apex -->
    <circle cx="256" cy="145" r="18" fill="#ffffff" />
    <circle cx="256" cy="145" r="8" fill="#a3ff12" />
  </g>
</svg>
